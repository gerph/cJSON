---
# RISC OS CI build through build.riscos.online
#
# Generated from the riscos-project create-ci baseline and adapted to export
# the cJSON library described by .robuild.yaml.

name: RISC OS

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:
    types: [opened, reopened, synchronize]
    branches: ["*"]

env:
  COMPONENT_NAME: "cJSON"

jobs:
  build-riscos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: riscos-build-server
    outputs:
      version: ${{ steps.version.outputs.version }}
      leafname: ${{ steps.version.outputs.leafname }}

    steps:
      - uses: actions/checkout@v7

      - name: Obtain prerequisite build tool
        run: |
          curl -s -L -o riscos-build-online https://github.com/gerph/robuild-client/releases/download/v0.07/riscos-build-online
          chmod +x riscos-build-online

      - name: Build through build.riscos.online
        run: |
          zip -q9r /tmp/source-archive.zip cJSON.c cJSON.h riscos .robuild.yaml
          ./riscos-build-online -i /tmp/source-archive.zip -a off -t 60 -o /tmp/built

      - name: Give the output a versioned name
        id: version
        run: |
          if [ -f riscos/VersionNum ] ; then
              version=$(awk -F'"' '/^#define Module_FullVersion[[:space:]]+"/ { print $2; exit }' riscos/VersionNum)
          else
              version=$(git rev-parse --short HEAD)
          fi
          leafname="$COMPONENT_NAME-$version.zip"
          if [ -f /tmp/built,a91 ] ; then
              cp /tmp/built,a91 "$leafname"
          else
              echo "No archive was built?"
              exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "leafname=$leafname" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: cJSON-riscos-library
          path: ${{ steps.version.outputs.leafname }}

  build-riscos64:
    runs-on: ubuntu-latest
    container:
      image: gerph/riscos-build:latest-64bit
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: RISC OS 64 build
        run: |
          cd riscos
          riscos-amu BUILD64=1
          riscos-amu BUILD64=1 export

      - name: Create archive of 64-bit exports
        run: |
          mkdir -p Artifacts/Lib
          cp -R "$BUILD_DIR/Export/Lib/$COMPONENT_NAME" "Artifacts/Lib/$COMPONENT_NAME"
          cd Artifacts
          riscos-zip ../$COMPONENT_NAME-riscos64.zip *

      - uses: actions/upload-artifact@v7
        with:
          name: cJSON-riscos64-library
          path: ${{ env.COMPONENT_NAME }}-riscos64.zip

  release:
    needs: [build-riscos, build-riscos64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    container:
      image: gerph/riscos-build:latest-64bit
    permissions:
      contents: write

    steps:
      - name: Download exported 32-bit RISC OS library
        uses: actions/download-artifact@v8
        with:
          name: cJSON-riscos-library

      - name: Download exported 64-bit RISC OS library
        uses: actions/download-artifact@v8
        with:
          name: cJSON-riscos64-library

      - name: Combine the RISC OS library exports for release
        id: package
        run: |
          leafname="${{ needs.build-riscos.outputs.leafname }}"
          mkdir -p Artifacts
          riscos-unzip -C Artifacts "$leafname"
          riscos-unzip -C Artifacts "$COMPONENT_NAME-riscos64.zip"
          (
            cd Artifacts
            riscos-zip "../$leafname" *
          )
          riscos-unzip -l "$leafname"
          echo "leafname=$leafname" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          prerelease: false
          draft: true
          artifacts: "${{ steps.package.outputs.leafname }}"
          artifactContentType: application/zip
